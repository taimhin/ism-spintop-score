<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ISM 初中組陀螺大賽 — 計分系統</title>
<style>
:root{
  --bg:#eef2f7; --ink:#1e293b; --muted:#64748b; --line:#cbd5e1; --line2:#e2e8f0;
  --blue:#2563eb; --blue-bg:#dbeafe;
  --gold:#b45309; --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px;
}
.hidden{display:none!important}

/* ---------- header ---------- */
header.app-header{
  position:sticky; top:0; z-index:50;
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  padding:10px 18px; background:rgba(255,255,255,.94); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line2);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:30px}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{background:var(--blue-bg);color:var(--blue);padding:1px 9px;border-radius:999px;font-weight:700}
.badge.syncOn{background:#dcfce7;color:#15803d}
.badge.syncOff{background:#fef3c7;color:#b45309}
.badge.syncCloud{background:#e0e7ff;color:#4338ca}
nav.tabs{display:flex;gap:6px}
nav.tabs button{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:8px 16px; border-radius:10px; font-size:15px; cursor:pointer; font-weight:600; font-family:inherit;
}
nav.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{padding:14px 18px 40px;max-width:1600px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}
h2{font-size:16px;margin:6px 0 10px}
h2 small{font-weight:400;color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12.5px}

/* ---------- buttons ---------- */
.btn{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);
}
.btn:hover{border-color:#93c5fd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:#f8fafc}
.btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--red)}

/* ---------- bracket（PDF 排版：左半 ↔ 右半 鏡像，中央決賽） ---------- */
.bracket-scroll{overflow-x:auto;padding-bottom:8px;border:1px solid var(--line2);border-radius:12px;background:#f8fafc}
.bracket-inner{min-width:1950px;padding:14px 22px}
.colheads-pdf{display:grid;grid-template-columns:repeat(12,132px);column-gap:28px;margin-bottom:10px}
.colheads-pdf div{text-align:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.colheads-pdf .span2{grid-column:span 2}
.bracket-grid-pdf{
  display:grid;grid-template-columns:repeat(12,132px);grid-template-rows:repeat(32,27px);
  column-gap:28px;row-gap:0;position:relative;
}
.bcell{position:relative;display:flex;align-items:center;justify-content:center;pointer-events:none}
.slotbox{
  pointer-events:auto;width:100%;height:24px;box-sizing:border-box;
  display:flex;align-items:center;gap:5px;padding:0 7px;
  background:#fff;border:1.5px solid var(--line);border-radius:7px;
  position:relative;font-size:12.5px;cursor:default;
}
.slotbox.clickable{cursor:pointer;transition:border-color .12s, box-shadow .12s}
.slotbox.clickable:hover{border-color:#93c5fd;box-shadow:0 2px 8px rgba(37,99,235,.16)}
.slotbox.winpick:hover{border-color:#86efac;box-shadow:0 2px 8px rgba(22,163,74,.2)}
.slotbox .seed{font-size:9.5px;color:#94a3b8;min-width:15px;text-align:right;font-variant-numeric:tabular-nums}
.slotbox .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotbox .sc{font-weight:700;color:#475569;font-size:12px;font-variant-numeric:tabular-nums}
.slotbox.win{background:#dcfce7;border-color:#86efac}
.slotbox.win .nm{font-weight:700;color:#166534}
.slotbox.win .sc{color:#15803d}
.slotbox.lose{opacity:.42}
.slotbox.empty{border-style:dashed;background:#f8fafc}
.slotbox.tbd .nm{color:#94a3b8}
.slotbox.bye{background:#e0f2fe;border-color:#bae6fd}
.slotbox.bye .byetag{font-size:9px;color:#1d4ed8;border:1px solid #bfdbfe;background:#dbeafe;border-radius:999px;padding:0 5px;line-height:13px;white-space:nowrap}
.slotbox.sel{outline:2.5px solid var(--blue);outline-offset:1px}
/* 連接線 */
.slotbox.stubR::after{content:'';position:absolute;right:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.slotbox.stubL::after{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.bcell.recvL::before{content:'';position:absolute;left:-14px;top:25%;height:50%;border-left:2px solid var(--line)}
.bcell.recvR::before{content:'';position:absolute;right:-14px;top:25%;height:50%;border-right:2px solid var(--line)}
/* 中央：冠軍卡 / 季軍賽卡 */
.champ-card{
  width:100%;text-align:center;border:2px dashed #f59e0b;border-radius:16px;
  background:linear-gradient(180deg,#fffbeb,#fef3c7);padding:14px 10px;
}
.champ-card .trophy{font-size:34px;line-height:1}
.rk-label{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.champ-name{font-size:clamp(15px,1.5vw,20px);font-weight:800;color:var(--gold);margin-top:3px}
.podcard{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.podcard-title{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:7px}
.podcard-title small{font-weight:400}
.t-pair{display:flex;gap:10px}
.t-pair .slotbox{width:calc(50% - 5px)}
.pod-lines{margin-top:9px;font-size:12.5px;color:#334155;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.pod-lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 縮放工具列 / 模式切換 */
.bracket-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn.sm{padding:5px 11px;font-size:13px}
.zoom-label{font-size:13px;color:var(--muted);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.mode-switch{margin-left:auto;display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.ms-btn{border:none;background:transparent;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.ms-btn.active{background:var(--blue);color:#fff}
.pscore.winmode{font-size:clamp(26px,4vw,56px);letter-spacing:.02em}

/* ---------- board ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;align-items:stretch}
.chip-sep{display:flex;align-items:center;color:var(--muted);font-size:11.5px;font-weight:700;padding:0 6px;white-space:nowrap}
.chip{
  flex:0 0 auto;min-width:118px;max-width:180px;text-align:left;
  border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:6px 9px;cursor:pointer;font-family:inherit;color:var(--ink);
}
.chip .ct{font-size:12.5px;font-weight:700;display:block}
.chip .cn{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.chip.ready{border-color:#93c5fd;background:#eff6ff}
.chip.done{border-color:#bbf7d0;background:#f0fdf4}
.chip.done .ct{color:#166534}
.chip.selected{outline:3px solid var(--blue)}
.board-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 12px}
.board-round{font-size:18px;font-weight:800}
.board-hint{color:var(--muted);font-size:13px}
.score-stage{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;max-width:1250px;margin:0 auto}
.side{
  border-radius:18px;padding:20px 16px;text-align:center;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:#fff;border:2.5px solid var(--line);position:relative;
  transition:border-color .15s, box-shadow .15s, transform .05s;
}
.side:hover{border-color:#93c5fd}
.side:active{transform:scale(.995)}
.side.winner{border-color:#16a34a;background:linear-gradient(180deg,#f0fdf4,#dcfce7);box-shadow:0 0 0 5px rgba(22,163,74,.14)}
.side.loser{opacity:.45}
.side.disabled{cursor:not-allowed}
.side.disabled .pscore{color:#cbd5e1}
.pseed{font-size:12px;color:#94a3b8;font-weight:700;letter-spacing:.08em}
.pname{font-size:clamp(20px,3.2vw,40px);font-weight:700;margin-top:4px;word-break:break-all}
.pscore{font-size:clamp(64px,12vw,150px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#1e293b}
.pscore.pulse{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.vs{display:flex;align-items:center;justify-content:center;font-weight:900;color:#94a3b8;font-size:20px;letter-spacing:.1em}
.board-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.win-banner{
  margin:16px auto 0;max-width:900px;text-align:center;
  background:linear-gradient(90deg,#dcfce7,#f0fdf4);border:2px solid #86efac;color:#166534;
  font-size:clamp(18px,2.4vw,30px);font-weight:800;padding:14px;border-radius:14px;
}
.empty-state{
  text-align:center;color:var(--muted);font-size:18px;padding:60px 20px;
  background:#fff;border:1.5px dashed var(--line);border-radius:16px;
}

/* ---------- standings ---------- */
.podium{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
.pod{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.pod .pod-rank{font-size:26px}
.pod .rk-label{letter-spacing:.12em}
.pod .pod-name{font-size:clamp(15px,1.6vw,22px);font-weight:800;margin-top:4px;word-break:break-all}
.pod.p1{border-color:#fcd34d;background:linear-gradient(180deg,#fffbeb,#fef3c7)}
.pod.p2{border-color:#cbd5e1;background:linear-gradient(180deg,#f8fafc,#f1f5f9)}
.pod.p3{border-color:#fdba74;background:linear-gradient(180deg,#fff7ed,#ffedd5)}
.standings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.table-wrap{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh}
table.results{border-collapse:collapse;width:100%;font-size:13.5px}
table.results th,table.results td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
table.results thead th{position:sticky;top:0;background:#f8fafc;font-size:12px;color:var(--muted);letter-spacing:.05em;z-index:1}
table.results tr.done td{background:#f0fdf4}
table.results td.win{font-weight:700;color:#15803d}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:#f1f5f9;color:var(--muted);border:1px solid var(--line2)}
.tag.live{background:#eff6ff;color:var(--blue);border-color:#bfdbfe}
.tag.fin{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}

/* ---------- settings ---------- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;max-width:1050px}
.card label{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.card input[type=text],.card input[type=number]{
  padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);
}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}
.name-item{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:4px 8px}
.name-item .s{font-size:11px;color:#94a3b8;min-width:24px;font-variant-numeric:tabular-nums}
.name-item input{border:none;background:transparent;font-size:13.5px;width:100%;font-family:inherit;outline:none;color:var(--ink)}
.danger-zone .btn{margin-right:10px;margin-bottom:6px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:#fff;border-radius:14px;max-width:540px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{margin:0 0 10px;font-size:17px}
.modal-msg{white-space:pre-line;color:#334155;font-size:14px;max-height:50vh;overflow:auto;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
  z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:80vw;text-align:center;
}

/* ---------- print ---------- */
.print-area{display:none}
@media print{
  body{background:#fff}
  header.app-header,main,.modal,.toast{display:none!important}
  .print-area{display:block!important}
  .print-area h1{font-size:22px;margin:0 0 4px}
  .print-area .meta{color:#475569;font-size:12px;margin-bottom:12px}
  .print-area .podline{font-size:15px;margin:4px 0}
  .print-area table{width:100%;border-collapse:collapse;font-size:12px}
  .print-area th,.print-area td{border:1px solid #94a3b8;padding:4px 6px;text-align:left}
}

/* ---------- narrow screens ---------- */
@media (max-width: 860px){
  .score-stage{grid-template-columns:1fr}
  .vs{display:none}
  .podium{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">🌀</div>
    <div>
      <h1 id="appTitle">ISM 初中組陀螺大賽</h1>
      <div class="sub">
        <span class="badge" id="ruleBadge">先取 4 分制</span>
        <span>單淘汰 · 含季軍賽</span>
        <span id="saveInfo">尚未儲存</span>
        <span id="syncInfo" class="badge hidden"></span>
      </div>
    </div>
  </div>
  <nav class="tabs">
    <button data-tab="bracket" class="active">對陣圖</button>
    <button data-tab="board">記分板</button>
    <button data-tab="standings">名次</button>
    <button data-tab="settings">設定</button>
  </nav>
</header>

<main>
  <section id="tab-bracket" class="tab-panel active">
    <div class="bracket-toolbar">
      <button class="btn ghost sm" id="btnZoomOut" title="縮小">－</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="btn ghost sm" id="btnZoomIn" title="放大">＋</button>
      <button class="btn ghost sm" id="btnZoomFit">🔍 符合視窗</button>
      <button class="btn ghost sm" id="btnZoom100">100%</button>
      <button class="btn ghost sm" id="btnFullscreen">⛶ 全螢幕</button>
    </div>
    <div class="bracket-scroll">
      <div class="bracket-inner">
        <div class="colheads-pdf">
          <div>64強</div><div>32強</div><div>16強</div><div>8強</div><div>4強</div>
          <div class="span2">決賽</div>
          <div>4強</div><div>8強</div><div>16強</div><div>32強</div><div>64強</div>
        </div>
        <div id="bracketGrid" class="bracket-grid-pdf"></div>
      </div>
    </div>
    <p class="hint" id="bracketHint" style="margin-top:10px"></p>
  </section>

  <section id="tab-board" class="tab-panel">
    <div id="boardChips" class="chips"></div>
    <div id="boardEmpty" class="empty-state hidden"></div>
    <div id="boardMain" class="hidden">
      <div class="board-head">
        <span id="boardRound" class="board-round"></span>
        <span id="boardHint" class="board-hint"></span>
        <span class="mode-switch">
          <button class="ms-btn" data-mode="score">輸入分數</button>
          <button class="ms-btn" data-mode="win">點選勝利者</button>
        </span>
      </div>
      <div class="score-stage">
        <div class="side" id="sideA">
          <div class="pseed" id="seedA"></div>
          <div class="pname" id="nameA">待定</div>
          <div class="pscore" id="scoreA">0</div>
        </div>
        <div class="vs">VS</div>
        <div class="side" id="sideB">
          <div class="pseed" id="seedB"></div>
          <div class="pname" id="nameB">待定</div>
          <div class="pscore" id="scoreB">0</div>
        </div>
      </div>
      <div class="board-controls">
        <button class="btn ghost" id="btnMinusA">← A 減 1 分</button>
        <button class="btn ghost" id="btnResetMatch">重設此場</button>
        <button class="btn ghost" id="btnMinusB">B 減 1 分 →</button>
        <button class="btn primary" id="btnNext">下一場 →</button>
      </div>
      <div id="winBanner" class="win-banner hidden"></div>
    </div>
  </section>

  <section id="tab-standings" class="tab-panel">
    <div class="podium" id="podium"></div>
    <div class="standings-actions">
      <button class="btn primary" id="btnPrint">🖨 列印成績表</button>
      <button class="btn" id="btnShare">🔗 複製分享連結</button>
      <button class="btn" id="btnCsv">⬇ 匯出 CSV</button>
      <button class="btn" id="btnJson">⬇ 匯出備份 (JSON)</button>
    </div>
    <div class="table-wrap">
      <table class="results">
        <thead>
          <tr><th>輪次</th><th>場次</th><th>選手 A</th><th>比分</th><th>選手 B</th><th>勝方</th><th>狀態</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div class="card">
      <h2>基本設定</h2>
      <label>比賽名稱 <input id="setTitle" type="text" style="flex:1;max-width:420px"></label>
      <label>每場先取分數 <input id="setWinScore" type="number" min="1" max="99" style="width:90px"></label>
      <label>操作模式
        <select id="setUiMode" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit">
          <option value="score">輸入分數（先取 4 分制）</option>
          <option value="win">點選勝利者（不需輸入分數）</option>
        </select>
      </label>
      <p class="hint">預設為 4 分（依對陣表規定：先得 4 分者晉級）。</p>
    </div>
    <div class="card">
      <h2>選手名單 <small>（數字為對陣表上的種子編號，可直接修改）</small></h2>
      <div id="nameGrid" class="name-grid"></div>
    </div>
    <div class="card danger-zone">
      <h2>資料管理</h2>
      <button class="btn" id="btnImport">匯入備份…</button>
      <input id="fileImport" type="file" accept=".json,application/json" class="hidden">
      <button class="btn danger" id="btnResetAll">清除所有結果</button>
      <p class="hint" style="margin-top:8px">所有資料自動存在本機瀏覽器（離線可用）；建議賽前先按「匯出備份」保存一份。</p>
    </div>
  </section>
</main>

<div id="printArea" class="print-area"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalMsg" class="modal-msg"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">確定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
'use strict';

// ==CORE-START==
/* ===================== 核心資料與邏輯（不碰 DOM） ===================== */

const DEFAULT_NAMES = {
  '1':'F3D區皓竣',   '3':'F3E黃俊希',   '4':'F1C黃傲琛',   '5':'F1C劉卓興',
  '7':'F1E黃璟翰',   '9':'F2D李浩綸',   '11':'F1B劉愷庭',  '13':'F1E湯文軒',
  '15':'F1C馮俊霆',  '17':'F1C嚴啟樂',  '19':'F3E林柏豪',  '20':'F1A施孝洋',
  '21':'F1D何亮樂',  '23':'F2B吳睿謙',  '25':'F3E李柏澔',  '27':'F1C李承霖',
  '29':'F2B黃恩賜',  '31':'F2E郭駿傑',  '33':'F3E林煒軒',  '35':'F1A劉浩舜',

/* 解析順序：上游必須排在依賴它的比賽之前 */
const ORDER = [
  'Q1','Q2','Q3','Q4',
  'R32-1','R32-2','R32-3','R32-4','R32-5','R32-6','R32-7','R32-8',
  'R32-9','R32-10','R32-11','R32-12','R32-13','R32-14','R32-15','R32-16',

  'QF-1','QF-2','QF-3','QF-4',
  'SF-1','SF-2',
  'T-1','F-1'
];

function decideWinner(sa, sb, k){
  if (sa >= k && sb >= k) return sa > sb ? 'a' : (sb > sa ? 'b' : null);
  if (sa >= k) return 'a';
  if (sb >= k) return 'b';
  return null;
}

/* 將所有比分換算成完整對陣狀態：seeds + 勝負
   winners：點選模式宣告的勝方（{id:'a'|'b'}）；省略時讀取全域 state.winners */
function resolveAll(scores, k, winners){
  if (winners === undefined && typeof state !== 'undefined' && state) winners = state.winners || {};
  const R = {};
  const resSrc = (src) => {
    if (src.seed) return src.seed;
    const m = R[src.winnerOf || src.loserOf];
    if (!m || !m.winner) return null;
    const winSeed  = m.winner === 'a' ? m.aSeed : m.bSeed;
    const loseSeed = m.winner === 'a' ? m.bSeed : m.aSeed;
    return src.winnerOf ? winSeed : loseSeed;
  };
  for (const id of ORDER){
    const d = MATCH_DEFS[id];
    const sc = scores[id] || [0,0];
    const aSeed = resSrc(d.a);
    const bSeed = resSrc(d.b);
    const w = decideWinner(sc[0], sc[1], k) || (winners && winners[id]) || null;
    R[id] = {aSeed, bSeed, sa:sc[0], sb:sc[1], winner:w};
  }
  return R;
}

/* 套用 simScores 後，哪些「已有比分或已宣告勝方」的比賽會因為參賽者變動而必須被清除 */
function computeCleared(scores, simScores, kBefore, kAfter){
  const before = resolveAll(scores, kBefore);
  const wmap = (typeof state !== 'undefined' && state) ? (state.winners || {}) : {};
  const C = new Set();
  let dirty = true;
  while (dirty){
    dirty = false;
    const sim = {...simScores};
    C.forEach(m => delete sim[m]);
    const after = resolveAll(sim, kAfter);
    for (const mid of ORDER){
      const b = before[mid], a2 = after[mid];
      if (b.aSeed !== a2.aSeed || b.bSeed !== a2.bSeed){
        const sc = simScores[mid];
        if (((sc && (sc[0] > 0 || sc[1] > 0)) || wmap[mid]) && !C.has(mid)){ C.add(mid); dirty = true; }
      }
    }
  }
  return C;
}

function nameOf(seed, names){
  if (!seed) return '待定';
  const n = names[seed] || DEFAULT_NAMES[seed];
  return n && String(n).trim() ? n : '待定';
}

function winnerNameOf(m, names){
  if (!m || !m.winner) return null;
  return nameOf(m.winner === 'a' ? m.aSeed : m.bSeed, names);
}
function loserNameOf(m, names){
  if (!m || !m.winner) return null;
  return nameOf(m.winner === 'a' ? m.bSeed : m.aSeed, names);
}

function firstReady(scores, k){
  const R = resolveAll(scores, k);
  for (const id of ORDER){
    const m = R[id];
    if (m.aSeed && m.bSeed && !m.winner) return id;
  }
  return null;
}

function standings(scores, k, names){
  const R = resolveAll(scores, k);
  const f = R['F-1'], t = R['T-1'];
  return {
    champion: winnerNameOf(f, names),
    runnerUp: loserNameOf(f, names),
    third:    winnerNameOf(t, names),
    fourth:   loserNameOf(t, names)
  };
}

function buildResultRows(scores, k, names){
  const R = resolveAll(scores, k);
  return ORDER.map(id => {
    const d = MATCH_DEFS[id], m = R[id];
    const aName = nameOf(m.aSeed, names), bName = nameOf(m.bSeed, names);
    const hasScores = m.sa > 0 || m.sb > 0;
    const score = hasScores ? (m.sa + ' : ' + m.sb) : '—';
    let status;
    if (m.winner) status = '已完成';
    else if (!m.aSeed || !m.bSeed) status = '待定';
    else if (hasScores) status = '進行中';
    else status = '未開始';
    const winName = m.winner ? (m.winner === 'a' ? aName : bName) : '—';
    return {
      id, round: ROUND_INFO[d.r].label, no: d.no,
      aName, bName, score, winName, status,
      started: hasScores, done: !!m.winner, ready: !!(m.aSeed && m.bSeed)
    };
  });
}

function freshState(){

    v: 1,

    winScore: 4,
    names: {...DEFAULT_NAMES},
    scores: {},
    winners: {},
    updatedAt: null
  };
}

function sanitizeScores(raw){
  const out = {};
  if (raw && typeof raw === 'object'){
    for (const id in raw){
      if (!MATCH_DEFS[id]) continue;
      const v = raw[id];
      if (Array.isArray(v) && v.length === 2 && v.every(n => Number.isFinite(n) && n >= 0)){
        out[id] = [Math.floor(v[0]), Math.floor(v[1])];
      }
    }
  }
  return out;
}

function sanitizeWinners(raw){
  const out = {};
  if (raw && typeof raw === 'object'){
    for (const id in raw){
      if (!MATCH_DEFS[id]) continue;
      const v = raw[id];
      if (v === 'a' || v === 'b') out[id] = v;
    }
  }
  return out;
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return freshState();
    const obj = JSON.parse(raw);
    const st = freshState();
    if (obj && typeof obj === 'object'){
      if (obj.title) st.title = String(obj.title);
      if (Number.isFinite(obj.winScore)) st.winScore = Math.max(1, Math.min(99, Math.floor(obj.winScore)));
      if (obj.names && typeof obj.names === 'object'){
        for (const key in obj.names){
          if (key in DEFAULT_NAMES) st.names[key] = String(obj.names[key]);
        }
      }
      st.scores = sanitizeScores(obj.scores);
      st.winners = sanitizeWinners(obj.winners);
      st.updatedAt = obj.updatedAt || null;
    }
    return st;
  }catch(err){
    return freshState();
  }
}

/* ---------- 分享連結（把目前比賽狀態編碼進網址） ---------- */
function b64encodeUtf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decodeUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function buildShareLink(){
  const data = {title: state.title, winScore: state.winScore, names: state.names, scores: state.scores, winners: state.winners};
  return location.href.split('#')[0] + '#s=' + b64encodeUtf8(JSON.stringify(data));
}

/* ---------- 即時同步（場地主機模式；線上版/單機版會自動停用） ---------- */
const SYNC = { enabled: false, rev: 0, busy: false };
let suppressPush = false;
let pushTimer = null;

function setSyncBadge(kind){
  const el = document.getElementById('syncInfo');
  if (!el) return;
  if (kind === 'cloud'){ el.className = 'badge syncCloud'; el.textContent = '☁️ 雲端同步中'; }
  else if (kind === 'on' || kind === 'lan'){ el.className = 'badge syncOn'; el.textContent = '🟢 場地同步中'; }
  else if (kind === 'wait'){ el.className = 'badge syncOff'; el.textContent = '⏳ 連線中…'; }
  else if (kind === 'off'){ el.className = 'badge syncOff'; el.textContent = '🟠 離線（單機中）'; }
  else { el.className = 'badge hidden'; el.textContent = ''; }
}

function applyStateObject(obj){
  if (!obj || typeof obj !== 'object') return false;
  if (obj.title) state.title = String(obj.title);
  if (Number.isFinite(obj.winScore)) state.winScore = Math.max(1, Math.min(99, Math.floor(obj.winScore)));
  if (obj.names && typeof obj.names === 'object'){
    for (const key in obj.names){
      if (key in DEFAULT_NAMES) state.names[key] = String(obj.names[key]);
    }
  }
  state.scores = sanitizeScores(obj.scores);
  state.winners = sanitizeWinners(obj.winners);
  return true;
}

function snapshotState(){
  return {
    title: state.title,
    winScore: state.winScore,
    names: state.names,
    scores: state.scores,
    winners: state.winners
  };
}

/* ---------- 雲端即時同步（MQTT 公共通道，免帳號；GitHub 線上版用） ---------- */
const CLOUD_TOPIC = 'ism-spintop-7f3a9c2e-42d8/state';
const CLOUD_BROKERS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const CLOUD_LIBS = [
  'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',
  'https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'
];
let cloudClient = null;
let cloudPending = false;
let cloudGotInitial = false;
let cloudHeartbeat = null;
const cloudDeviceId = 'd' + Math.random().toString(16).slice(2, 10);

function loadScriptTag(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('load fail'));
    document.head.appendChild(s);
  });
}

async function loadMqttLib(){
  if (window.mqtt) return true;
  for (const src of CLOUD_LIBS){
    try{
      await loadScriptTag(src);
      if (window.mqtt) return true;
    }catch(err){}
  }
  return false;
}

function cloudPublishNow(){
  if (!cloudClient || !cloudClient.connected){ cloudPending = true; return false; }
  SYNC.rev += 1;
  const doc = {rev: SYNC.rev, by: cloudDeviceId, state: snapshotState(), t: Date.now()};
  try{
    cloudClient.publish(CLOUD_TOPIC, JSON.stringify(doc), {qos: 1, retain: true});
  }catch(err){ cloudPending = true; return false; }
  return true;
}

function onCloudMessage(topic, payload){
  cloudGotInitial = true;
  let doc;
  try{ doc = JSON.parse(payload.toString()); }catch(err){ return; }
  if (!doc || typeof doc.rev !== 'number') return;
  if (doc.by === cloudDeviceId) return;
  if (doc.rev <= SYNC.rev) return;
  SYNC.rev = doc.rev;
  suppressPush = true;
  if (doc.state) applyStateObject(doc.state);
  save();
  renderAll({skipSettings: true});
  suppressPush = false;
}

function cloudConn(broker){
  return new Promise(resolve => {
    let settled = false;
    let client = null;
    const finish = ok => { if (!settled){ settled = true; clearTimeout(to); resolve(ok ? client : null); } };
    const to = setTimeout(() => { if (!settled){ try{ if (client) client.end(true); }catch(err){} finish(false); } }, 9000);
    try{
      client = window.mqtt.connect(broker, {
        clientId: 'ismtt_' + cloudDeviceId + Math.random().toString(16).slice(2, 6),
        keepalive: 30, reconnectPeriod: 4000, connectTimeout: 6000, clean: true
      });
    }catch(err){ finish(false); return; }
    client.on('connect', () => {
      client.subscribe(CLOUD_TOPIC, {qos: 1});
      setSyncBadge('cloud');
      if (cloudPending){ cloudPending = false; cloudPublishNow(); }
      setTimeout(() => {
        if (!cloudGotInitial && Object.keys(state.scores).length > 0) cloudPublishNow();
      }, 1800);
      finish(true);
    });
    client.on('message', onCloudMessage);
    client.on('close', () => { if (SYNC.kind === 'cloud') setSyncBadge('off'); });
    client.on('error', () => {
      if (!settled){ try{ client.end(true); }catch(err){} finish(false); }
    });
  });
}

async function tryCloud(){
  if (!await loadMqttLib()) return false;
  for (const broker of CLOUD_BROKERS){
    const client = await cloudConn(broker);
    if (client){
      cloudClient = client;
      SYNC.enabled = true;
      SYNC.kind = 'cloud';
      if (!cloudHeartbeat){
        cloudHeartbeat = setInterval(() => {
          if (SYNC.kind === 'cloud' && cloudClient && cloudClient.connected && Object.keys(state.scores).length > 0){
            const doc = {rev: SYNC.rev, by: cloudDeviceId, state: snapshotState(), t: Date.now()};
            try{ cloudClient.publish(CLOUD_TOPIC, JSON.stringify(doc), {qos: 1, retain: true}); }catch(err){}
          }
        }, 60000);
      }
      return true;
    }
  }
  return false;
}

async function pushServer(){
  if (!SYNC.enabled || SYNC.busy) return true;
  SYNC.busy = true;
  try{
    const r = await fetch('api/state', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({baseRev: SYNC.rev, state: snapshotState()})
    });
    if (r.status === 409){
      const j = await r.json();
      SYNC.rev = j.rev;
      suppressPush = true;
      applyStateObject(j.state);
      save();
      renderAll({skipSettings: true});
      suppressPush = false;
      toast('偵測到其他裝置的更新，已載入最新比分（請確認剛才的操作是否還需要）');
      return false;
    }
    if (r.ok){
      const j = await r.json();
      SYNC.rev = j.rev;
      setSyncBadge('on');
      return true;
    }
    setSyncBadge('off');
    return false;
  }catch(err){
    setSyncBadge('off');
    return false;
  }finally{
    SYNC.busy = false;
  }
}

function pushSoon(){
  if (!SYNC.enabled) return;
  if (SYNC.kind === 'cloud'){
    if (cloudClient && cloudClient.connected) cloudPublishNow();
    else cloudPending = true;
    return;
  }
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushServer, 300);
}

async function pollServer(){
  if (!SYNC.enabled || SYNC.busy) return;
  try{
    const r = await fetch('api/state', {cache: 'no-store'});
    if (!r.ok) throw new Error('bad status');
    const j = await r.json();
    setSyncBadge('on');
    if (j.rev !== SYNC.rev){
      suppressPush = true;
      SYNC.rev = j.rev;
      applyStateObject(j.state);
      save();
      renderAll({skipSettings: true});
      suppressPush = false;
    }
  }catch(err){
    setSyncBadge('off');
  }
}

async function initSync(){
  setSyncBadge('wait');
  const qs = location.search;
  const forceLan = /[?&]lan/.test(qs) || /[?&]local/.test(qs);
  const forceCloud = /[?&]cloud/.test(qs);
  // 場地主機探測（與雲端並行，兩者都失敗才變單機）
  const lanProbe = fetch('api/state', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
  if (!forceLan){
    const cloudOk = await tryCloud();
    if (cloudOk) return;
  }
  if (!forceCloud){
    try{
      const j = await lanProbe;
      if (j && typeof j.rev === 'number'){
        SYNC.enabled = true;
        SYNC.kind = 'lan';
        SYNC.rev = j.rev;
        const serverHasData = j.state && j.state.scores && Object.keys(j.state.scores).length > 0;
        if (serverHasData){
          suppressPush = true;
          applyStateObject(j.state);
          save();
          renderAll({skipSettings: true});
          suppressPush = false;
        } else if (Object.keys(state.scores).length > 0){
          await pushServer();
        }
        setSyncBadge('lan');
        setInterval(pollServer, 2000);
        return;
      }
    }catch(err){}
  }
  setSyncBadge(null); // 單機模式：隱藏徽章
}

/* ===================== 小工具 ===================== */

const $ = s => document.querySelector(s);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
}

let modalResolve = null;
function confirmModal({title, message, confirmText = '確定', danger = false}){
  return new Promise(resolve => {
    modalResolve = resolve;
    $('#modalTitle').textContent = title;
    $('#modalMsg').textContent = message;
    const ok = $('#modalOk');
    ok.textContent = confirmText;
    ok.className = 'btn ' + (danger ? 'danger' : 'primary');
    $('#modal').classList.remove('hidden');
  });
}
function closeModal(result){
  $('#modal').classList.add('hidden');
  if (modalResolve){ const r = modalResolve; modalResolve = null; r(result); }
}

function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function updateSaveInfo(){
  $('#saveInfo').textContent = state.updatedAt ? ('已自動儲存 · ' + fmtTime(state.updatedAt)) : '尚未儲存';
}

function matchLabelOf(id){
  const d = MATCH_DEFS[id];
  const tag = (d.r === 'F' || d.r === 'T') ? ROUND_INFO[d.r].label : (ROUND_INFO[d.r].label + ' 第' + d.no + '場');
  const R = resolveAll(state.scores, state.winScore);
  const m = R[id];
  return tag + '（' + nameOf(m.aSeed, state.names) + ' vs ' + nameOf(m.bSeed, state.names) + '）';
}

/* ===================== 計分操作 ===================== */

function scoreOf(id){
  const sc = state.scores[id];
  return sc ? [sc[0], sc[1]] : [0,0];
}

async function trySetScores(id, next){
  const k = state.winScore;
  const cur = scoreOf(id);
  if (next[0] === cur[0] && next[1] === cur[1]) return;

  // 已完成的比賽不能繼續加分（改分請先減分或重設）
  const curWin = decideWinner(cur[0], cur[1], k) || (state.winners && state.winners[id]);
  if (curWin && (next[0] > cur[0] || next[1] > cur[1])){
    toast('此場已完成，如需修改請先按「重設此場」');
    return;
  }

  const simScores = {...state.scores, [id]: next};
  const C = computeCleared(state.scores, simScores, k, k);

  if (C.size){
    const list = [...C].map(mid => '・' + matchLabelOf(mid)).join('\n');
    const ok = await confirmModal({
      title: '需要清除後續比分',
      message: '這項變更會影響下列已記錄的比賽，這些比賽將被重設為 0:0：\n\n' + list + '\n\n確定要繼續嗎？',
      confirmText: '確定並清除',
      danger: true
    });
    if (!ok) return;
  }

  const ns = {...simScores};
  C.forEach(m => delete ns[m]);
  if (ns[id] && ns[id][0] === 0 && ns[id][1] === 0) delete ns[id];
  state.scores = ns;
  // 改為輸入分數時，清掉同場的「點選勝利者」宣告
  if (ns[id]){
    const nw = {...state.winners};
    delete nw[id];
    state.winners = nw;
  }
  save();
  renderAll();

  // 剛好達到獲勝分數 → 稍等一下就自動回到對陣圖
  const decidedNow = !!resolveAll(state.scores, state.winScore)[id].winner;
  if (!curWin && decidedNow && uiMode === 'score'){
    setTimeout(() => {
      if (uiMode === 'score' && document.querySelector('#tab-board').classList.contains('active')){
        switchTab('bracket');
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    }, 1500);
  }
}

/* 點選勝利者／取消結果：套用變更並處理後續清除 */
async function applyResultChange(mutator){
  const curScores = state.scores, curWinners = state.winners || {};
  const nScores = {...curScores}, nWinners = {...curWinners};
  mutator(nScores, nWinners);
  const B = resolveAll(curScores, state.winScore, curWinners);
  const C = new Set();
  let dirty = true;
  while (dirty){
    dirty = false;
    const simS = {...nScores}, simW = {...nWinners};
    C.forEach(m => { delete simS[m]; delete simW[m]; });
    const A2 = resolveAll(simS, state.winScore, simW);
    for (const mid of ORDER){
      const b = B[mid], a2 = A2[mid];
      if (b.aSeed !== a2.aSeed || b.bSeed !== a2.bSeed){
        const sc = nScores[mid], wn = nWinners[mid];
        if (((sc && (sc[0] > 0 || sc[1] > 0)) || wn) && !C.has(mid)){ C.add(mid); dirty = true; }
      }
    }
  }
  if (C.size){
    const list = [...C].map(mid => '・' + matchLabelOf(mid)).join('\n');
    const ok = await confirmModal({
      title: '需要清除後續結果',
      message: '這項變更會影響下列已記錄的比賽，將被重設：\n\n' + list + '\n\n確定要繼續嗎？',
      confirmText: '確定並清除',
      danger: true
    });
    if (!ok) return false;
  }
  C.forEach(m => { delete nScores[m]; delete nWinners[m]; });
  state.scores = nScores;
  state.winners = nWinners;
  save();
  renderAll();
  return true;
}

async function declareWinner(id, side){
  const R = resolveAll(state.scores, state.winScore);
  const m = R[id];
  if (!m.aSeed || !m.bSeed){ toast('此場選手尚未確定'); return; }
  const name = side === 'a' ? nameOf(m.aSeed, state.names) : nameOf(m.bSeed, state.names);
  const ok = await applyResultChange((s, w) => { delete s[id]; w[id] = side; });
  if (ok) toast('🏆 ' + name + ' 勝出！');
}

async function trySetWinScore(k2){
  const k = state.winScore;
  if (k2 === k) return true;
  const C = computeCleared(state.scores, {...state.scores}, k, k2);
  if (C.size){
    const list = [...C].map(mid => '・' + matchLabelOf(mid)).join('\n');
    const ok = await confirmModal({
      title: '變更獲勝分數',
      message: '改變每場先取分數後，下列已記錄的比賽將被重設為 0:0：\n\n' + list + '\n\n確定要繼續嗎？',
      confirmText: '確定並清除',
      danger: true
    });
    if (!ok) return false;
  }
  const ns = {...state.scores};
  C.forEach(m => delete ns[m]);
  state.winScore = k2;
  state.scores = ns;
  save();
  renderAll();
  return true;
}

function switchTab(name){

    b.classList.toggle('active', b.dataset.tab === name);

/* ===================== 對陣圖 ===================== */

/* 64強各籤位所屬的資格賽對戰（只有這 4 場真的要比） */
const Q_SLOT = {'3':'Q1','4':'Q1','19':'Q2','20':'Q2','35':'Q3','36':'Q3','51':'Q4','52':'Q4'};

function renderBracket(){
  const R = resolveAll(state.scores, state.winScore);
  const cells = [];

  const box = (o) => {
    const cls = ['slotbox'];
    if (o.match) cls.push('clickable');
    if (o.state) cls.push(o.state);
    if (o.bye) cls.push('bye');
    if (o.empty) cls.push('empty');
    if (o.tbd) cls.push('tbd');
    if (o.stubL) cls.push('stubL');
    if (o.stubR) cls.push('stubR');
    if (o.sel) cls.push('sel');
    if (o.winpick) cls.push('winpick');
    if (o.winpick && o.name) o.title = '點一下＝宣告 ' + o.name + ' 勝出';
    let html = '<div class="' + cls.join(' ') + '"';
    if (o.match) html += ' data-match="' + o.match + '"';
    if (o.side) html += ' data-side="' + o.side + '"';
    if (o.title) html += ' title="' + escapeHtml(o.title) + '"';
    html += '>';
    if (o.seed) html += '<span class="seed">' + o.seed + '</span>';
    html += '<span class="nm">' + escapeHtml(o.name || '') + '</span>';
    if (o.bye) html += '<span class="byetag">輪空</span>';
    if (o.showScore) html += '<span class="sc">' + o.score + '</span>';
    html += '</div>';
    return html;
  };

  const cell = (col, row, span, inner, extraCls) =>
    '<div class="bcell ' + (extraCls || '') + '" style="grid-column:' + col + ';grid-row:' + row + ' / span ' + span + '">' + inner + '</div>';

  const winPick = uiMode === 'win';

  /* 一場比賽的兩個框（上下）；side：'L' 左半（連接線在左）、'R' 右半（連接線在右） */
  const matchPair = (id, col, rowA, spanA, rowB, spanB, side) => {
    const m = R[id];
    const recv = side === 'L' ? 'recvL' : 'recvR';
    const hasScores = m.sa > 0 || m.sb > 0;
    const mk = (key, seed, row, span, sc) => cell(col, row, span, box({
      seed: seed, name: nameOf(seed, state.names), score: sc, showScore: hasScores,
      state: m.winner ? (m.winner === key ? 'win' : 'lose') : '',
      match: id, side: key, tbd: !seed, stubL: true, stubR: true,
      sel: sel === id, title: matchLabelOf(id), winpick: winPick
    }), recv);
    return mk('a', m.aSeed, rowA, spanA, m.sa) + mk('b', m.bSeed, rowB, spanB, m.sb);
  };

  /* ---- 左半區：64強（32 籤） ---- */
  for (let s = 1; s <= 32; s++){
    const qid = Q_SLOT[s];
    const o = {seed: s, name: state.names[s] || '', stubR: true};
    if (qid){
      const m = R[qid];
      const key = (s % 2 === 1) ? 'a' : 'b';
      o.match = qid;
      o.side = key;
      o.winpick = winPick;
      o.title = matchLabelOf(qid);
      o.sel = sel === qid;
      if (m.winner) o.state = (m.winner === key) ? 'win' : 'lose';
      o.showScore = m.sa > 0 || m.sb > 0;
      o.score = key === 'a' ? m.sa : m.sb;
    } else if (state.names[s]){
      o.bye = true;
      o.title = '輪空：' + state.names[s] + ' 直接晉級 32 強';
    } else {
      o.empty = true;
    }
    cells.push(cell(1, s, 1, box(o)));
  }

  /* ---- 左半區：32強 → 4強 ---- */
  for (let j = 0; j < 8; j++){
    cells.push(matchPair('R32-' + (j + 1), 2, 4 * j + 1, 2, 4 * j + 3, 2, 'L'));
  }
  for (let i = 0; i < 4; i++){
    cells.push(matchPair('R16-' + (i + 1), 3, 8 * i + 1, 4, 8 * i + 5, 4, 'L'));
  }
  for (let q = 0; q < 2; q++){
    cells.push(matchPair('QF-' + (q + 1), 4, 16 * q + 1, 8, 16 * q + 9, 8, 'L'));
  }
  cells.push(matchPair('SF-1', 5, 1, 16, 17, 16, 'L'));

  /* ---- 中央：決賽（左、右各一框） ---- */
  {
    const m = R['F-1'];
    const hasScores = m.sa > 0 || m.sb > 0;
    const fbox = (key, seed, sc, col, stub, recv) => cell(col, 1, 32, box({
      seed: seed, name: nameOf(seed, state.names), score: sc, showScore: hasScores,
      state: m.winner ? (m.winner === key ? 'win' : 'lose') : '',
      match: 'F-1', side: key, tbd: !seed, stubL: stub === 'L', stubR: stub === 'R',
      sel: sel === 'F-1', title: matchLabelOf('F-1'), winpick: winPick
    }), recv);
    cells.push(fbox('a', m.aSeed, m.sa, 6, 'L', 'recvL'));
    cells.push(fbox('b', m.bSeed, m.sb, 7, 'R', 'recvR'));
  }

  /* ---- 右半區：4強 → 32強（鏡像） ---- */
  cells.push(matchPair('SF-2', 8, 1, 16, 17, 16, 'R'));
  for (let q = 0; q < 2; q++){
    cells.push(matchPair('QF-' + (q + 3), 9, 16 * q + 1, 8, 16 * q + 9, 8, 'R'));
  }
  for (let i = 0; i < 4; i++){
    cells.push(matchPair('R16-' + (i + 5), 10, 8 * i + 1, 4, 8 * i + 5, 4, 'R'));
  }
  for (let j = 0; j < 8; j++){
    cells.push(matchPair('R32-' + (j + 9), 11, 4 * j + 1, 2, 4 * j + 3, 2, 'R'));
  }

  /* ---- 右半區：64強（33-64 籤） ---- */
  for (let s = 33; s <= 64; s++){
    const qid = Q_SLOT[s];
    const o = {seed: s, name: state.names[s] || '', stubL: true};
    if (qid){
      const m = R[qid];
      const key = (s % 2 === 1) ? 'a' : 'b';
      o.match = qid;
      o.side = key;
      o.winpick = winPick;
      o.title = matchLabelOf(qid);
      o.sel = sel === qid;
      if (m.winner) o.state = (m.winner === key) ? 'win' : 'lose';
      o.showScore = m.sa > 0 || m.sb > 0;
      o.score = key === 'a' ? m.sa : m.sb;
    } else if (state.names[s]){
      o.bye = true;
      o.title = '輪空：' + state.names[s] + ' 直接晉級 32 強';
    } else {
      o.empty = true;
    }
    cells.push(cell(12, s - 32, 1, box(o)));
  }

  /* ---- 中央上：冠軍卡 ---- */
  const f = R['F-1'], t3 = R['T-1'];
  const champ = winnerNameOf(f, state.names);
  const second = loserNameOf(f, state.names);
  const third = winnerNameOf(t3, state.names);
  const fourth = loserNameOf(t3, state.names);
  cells.push(
    '<div class="bcell" style="grid-column:6 / span 2;grid-row:1 / span 5">' +
      '<div class="champ-card">' +
        '<div class="trophy">🏆</div>' +
        '<div class="rk-label">冠軍</div>' +
        '<div class="champ-name">' + (champ ? escapeHtml(champ) : '待定') + '</div>' +
        '<div class="rk-label" style="margin-top:4px">ISM Principal\'s Winner</div>' +
      '</div>' +
    '</div>'
  );

  /* ---- 中央下：季軍賽＋名次 ---- */
  const t = R['T-1'];
  const tStarted = t.sa > 0 || t.sb > 0;
  const tBox = (key, seed, sc) => box({
    seed: seed, name: nameOf(seed, state.names), score: sc, showScore: tStarted,
    state: t.winner ? (t.winner === key ? 'win' : 'lose') : '',
    match: 'T-1', side: key, tbd: !seed, sel: sel === 'T-1',
    title: matchLabelOf('T-1'), winpick: winPick
  });
  cells.push(
    '<div class="bcell" style="grid-column:6 / span 2;grid-row:22 / span 11">' +
      '<div class="podcard">' +
        '<div class="podcard-title">季軍賽 <small>（4強敗方對戰）</small></div>' +
        '<div class="t-pair">' + tBox('a', t.aSeed, t.sa) + tBox('b', t.bSeed, t.sb) + '</div>' +
        '<div class="pod-lines">' +
          '<div>🥇 冠軍：' + escapeHtml(champ || '待定') + '</div>' +
          '<div>🥈 亞軍：' + escapeHtml(second || '待定') + '</div>' +
          '<div>🥉 季軍：' + escapeHtml(third || '待定') + '</div>' +
          '<div>4️⃣ 殿軍：' + escapeHtml(fourth || '待定') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );

  $('#bracketGrid').innerHTML = cells.join('');
}

let zoomMode = (function(){ try{ return localStorage.getItem('ism-zoom') || 'fit'; }catch(err){ return 'fit'; } })();
function saveZoomPref(){ try{ localStorage.setItem('ism-zoom', String(zoomMode)); }catch(err){} }
function getZoom(){
  const inner = document.querySelector('.bracket-inner');
  return parseFloat(inner.style.zoom || '1') || 1;
}
function setZoom(z){
  zoomMode = Math.round(z * 100) / 100;
  saveZoomPref();
  applyZoom();
}
function applyZoom(){
  const inner = document.querySelector('.bracket-inner');
  const scroll = document.querySelector('.bracket-scroll');
  if (!inner || !scroll) return;
  let z;
  if (zoomMode === 'fit'){
    const base = 1950;
    z = Math.min(1, Math.max(0.3, (scroll.clientWidth - 6) / base));
  } else {
    z = parseFloat(zoomMode) || 1;
  }
  inner.style.zoom = z;
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = Math.round(z * 100) + '%';
}

function chipTitle(id){

  return ROUND_INFO[d.r].short + ' 第' + d.no + '場';

function renderChips(){

  for (const id of ORDER){
    const d = MATCH_DEFS[id];

      html += '<div class="chip-sep">' + ROUND_INFO[d.r].label + '</div>';

      '<span class="ct">' + chipTitle(id) + '</span>' +
      '<span class="cn">' + escapeHtml(aN + midTxt + bN) + '</span>' +

  sideB.className = 'side' + (m.winner === 'b' ? ' winner' : '') + (m.winner === 'a' ? ' loser' : '') + (!ready || m.winner ? ' disabled' : '');

    banner.classList.add('hidden');

function nextReadyMatch(){
  const R = resolveAll(state.scores, state.winScore);
  const idx = ORDER.indexOf(sel);
  for (let i = 1; i <= ORDER.length; i++){
    const id = ORDER[(idx + i) % ORDER.length];
    const m = R[id];
    if (m.aSeed && m.bSeed && !m.winner) return id;
  }
  return null;
}

/* ===================== 名次 / 賽果 ===================== */

function renderStandings(){
  const st = standings(state.scores, state.winScore, state.names);
  const pod = (cls, emoji, label, name) =>
    '<div class="pod ' + cls + '">' +
      '<div class="pod-rank">' + emoji + '</div>' +
      '<div class="rk-label">' + label + '</div>' +
      '<div class="pod-name">' + escapeHtml(name || '待定') + '</div>' +
    '</div>';
  $('#podium').innerHTML =
    pod('p1','🥇','冠軍', st.champion) +
    pod('p2','🥈','亞軍', st.runnerUp) +
    pod('p3','🥉','季軍', st.third) +
    pod('p4','4️⃣','殿軍', st.fourth);

  const rows = buildResultRows(state.scores, state.winScore, state.names);
  $('#resultsBody').innerHTML = rows.map(r => {
    const tag = r.done ? '<span class="tag fin">已完成</span>'
              : r.started ? '<span class="tag live">進行中</span>'
              : r.ready ? '<span class="tag">未開始</span>'
              : '<span class="tag">待定</span>';
    const noTxt = (MATCH_DEFS[r.id].r === 'F' || MATCH_DEFS[r.id].r === 'T') ? '—' : r.no;
    return '<tr class="' + (r.done ? 'done' : '') + '">' +
      '<td>' + r.round + '</td>' +
      '<td>' + noTxt + '</td>' +
      '<td>' + escapeHtml(r.aName) + '</td>' +
      '<td>' + r.score + '</td>' +
      '<td>' + escapeHtml(r.bName) + '</td>' +
      '<td class="' + (r.done ? 'win' : '') + '">' + escapeHtml(r.winName) + '</td>' +
      '<td>' + tag + '</td>' +
    '</tr>';
  }).join('');
}

/* ===================== 設定 ===================== */

function renderSettings(){
  $('#setTitle').value = state.title;
  $('#setWinScore').value = state.winScore;
  if ($('#setUiMode')) $('#setUiMode').value = uiMode;
  const seeds = Object.keys(DEFAULT_NAMES).map(Number).sort((a,b) => a-b);
  $('#nameGrid').innerHTML = seeds.map(seed =>
    '<label class="name-item"><span class="s">#' + seed + '</span>' +
    '<input type="text" data-seed="' + seed + '" value="' + escapeHtml(state.names[seed] || '') + '"></label>'
  ).join('');
}

/* ===================== 匯出 / 列印 ===================== */

function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
}

function exportCSV(){
  const rows = buildResultRows(state.scores, state.winScore, state.names);
  const head = ['輪次','場次','選手A','得分A','得分B','選手B','勝方','狀態'];
  const lines = [head.join(',')];
  for (const r of rows){
    const noTxt = (MATCH_DEFS[r.id].r === 'F' || MATCH_DEFS[r.id].r === 'T') ? '' : r.no;
    const [sa, sb] = r.started ? r.score.split(' : ') : ['',''];
    const q = v => '"' + String(v).replace(/"/g,'""') + '"';
    lines.push([r.round, noTxt, r.aName, sa, sb, r.bName, r.winName, r.status].map(q).join(','));
  }
  downloadFile('陀螺大賽賽果_' + stamp() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

function exportJSON(){
  downloadFile('陀螺大賽備份_' + stamp() + '.json', JSON.stringify(state, null, 2), 'application/json');
}

function printResults(){
  const st = standings(state.scores, state.winScore, state.names);
  const rows = buildResultRows(state.scores, state.winScore, state.names);
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const nowTxt = now.getFullYear() + '-' + p(now.getMonth()+1) + '-' + p(now.getDate()) + ' ' + p(now.getHours()) + ':' + p(now.getMinutes());
  let html = '<h1>' + escapeHtml(state.title) + ' — 成績表</h1>' +
    '<div class="meta">列印時間：' + nowTxt + ' · 賽制：單淘汰、先取 ' + state.winScore + ' 分 · 含季軍賽</div>' +
    '<h2>名次</h2>' +
    '<p class="podline">🥇 冠軍：' + escapeHtml(st.champion || '待定') + '</p>' +
    '<p class="podline">🥈 亞軍：' + escapeHtml(st.runnerUp || '待定') + '</p>' +
    '<p class="podline">🥉 季軍：' + escapeHtml(st.third || '待定') + '</p>' +
    '<p class="podline">4️⃣ 殿軍：' + escapeHtml(st.fourth || '待定') + '</p>' +
    '<h2>全部賽果</h2>' +
    '<table><thead><tr><th>輪次</th><th>場次</th><th>選手A</th><th>比分</th><th>選手B</th><th>勝方</th><th>狀態</th></tr></thead><tbody>';
  for (const r of rows){
    const noTxt = (MATCH_DEFS[r.id].r === 'F' || MATCH_DEFS[r.id].r === 'T') ? '—' : r.no;
    html += '<tr><td>' + r.round + '</td><td>' + noTxt + '</td><td>' + escapeHtml(r.aName) + '</td><td>' + r.score + '</td><td>' + escapeHtml(r.bName) + '</td><td>' + escapeHtml(r.winName) + '</td><td>' + r.status + '</td></tr>';
  }
  html += '</tbody></table>';
  $('#printArea').innerHTML = html;
  window.print();
}

/* ===================== 總渲染 ===================== */

function renderHeader(){
  $('#appTitle').textContent = state.title;
  $('#ruleBadge').textContent = '先取 ' + state.winScore + ' 分制';
  updateSaveInfo();
}

function renderAll(opts = {}){
  renderHeader();
  renderBracket();
  renderBoard();
  renderStandings();
  if (!opts.skipSettings) renderSettings();
  const bh = document.getElementById('bracketHint');
  if (bh){
    bh.textContent = uiMode === 'win'
      ? '點選選手框框＝直接宣告他獲勝（不需輸入分數）；🟩＝勝方、🟦＝輪空直接晉級。排版依原對陣表：左半區 ↔ 右半區、中央決賽。'
      : '點擊任一組框框即可到「記分板」記分；🟩＝勝方、🟦＝輪空直接晉級、虛線＝空籤位。排版依原對陣表：左半區 ↔ 右半區、中央決賽。';
  }
}

/* ===================== 事件綁定 ===================== */

function bindEvents(){
  // 分頁
  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });

  // 模式切換（輸入分數 / 點選勝利者）
  document.querySelectorAll('.ms-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      uiMode = btn.dataset.mode;
      try{ localStorage.setItem('ism-ui-mode', uiMode); }catch(err){}
      renderAll();
    });
  });

  // 對陣圖縮放 / 全螢幕
  $('#btnZoomOut').addEventListener('click', () => setZoom(Math.max(0.3, getZoom() - 0.1)));
  $('#btnZoomIn').addEventListener('click', () => setZoom(Math.min(1.6, getZoom() + 0.1)));
  $('#btnZoomFit').addEventListener('click', () => { zoomMode = 'fit'; saveZoomPref(); applyZoom(); });
  $('#btnZoom100').addEventListener('click', () => setZoom(1));
  $('#btnFullscreen').addEventListener('click', () => {
    try{
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }catch(err){}
  });
  window.addEventListener('resize', () => { if (zoomMode === 'fit') applyZoom(); });

  // 對陣圖點擊：計分模式 → 開記分板；點選模式 → 直接宣告勝方
  const openBoard = e => {
    const card = e.target.closest('.slotbox[data-match]');
    if (!card) return;
    const id = card.dataset.match;
    if (uiMode === 'win'){
      const R = resolveAll(state.scores, state.winScore);
      const m = R[id];
      const side = card.dataset.side;
      if (!side) return;
      const seedFor = side === 'a' ? m.aSeed : m.bSeed;
      if (!seedFor){ toast('此選手尚未確定'); return; }
      if (m.sa > 0 || m.sb > 0){ sel = id; switchTab('board'); return; }
      if (m.winner === side){ toast('這一位已經是勝方 👍'); return; }
      declareWinner(id, side);
      return;
    }
    sel = id;
    switchTab('board');
    window.scrollTo({top: 0, behavior: 'smooth'});
  };
  $('#bracketGrid').addEventListener('click', openBoard);

  // 記分板 chips
  $('#boardChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    sel = chip.dataset.id;
    renderAll();
  });

  // 分數操作
  $('#sideA').addEventListener('click', () => {
    if (!sel) return;
    const R = resolveAll(state.scores, state.winScore);
    const m = R[sel];
    if (!m.aSeed || !m.bSeed){ toast('此場選手尚未確定'); return; }
    if (m.winner) return;
    if (uiMode === 'win'){ declareWinner(sel, 'a'); return; }
    trySetScores(sel, [m.sa + 1, m.sb]);
  });
  $('#sideB').addEventListener('click', () => {
    if (!sel) return;
    const R = resolveAll(state.scores, state.winScore);
    const m = R[sel];
    if (!m.aSeed || !m.bSeed){ toast('此場選手尚未確定'); return; }
    if (m.winner) return;
    if (uiMode === 'win'){ declareWinner(sel, 'b'); return; }
    trySetScores(sel, [m.sa, m.sb + 1]);
  });
  $('#btnMinusA').addEventListener('click', () => {
    if (!sel) return;
    const [sa, sb] = scoreOf(sel);
    trySetScores(sel, [Math.max(0, sa - 1), sb]);
  });
  $('#btnMinusB').addEventListener('click', () => {
    if (!sel) return;
    const [sa, sb] = scoreOf(sel);
    trySetScores(sel, [sa, Math.max(0, sb - 1)]);
  });
  $('#btnResetMatch').addEventListener('click', async () => {
    if (!sel) return;
    const ok = await confirmModal({
      title: '重設此場',
      message: '確定要將「' + matchLabelOf(sel) + '」的結果重設嗎？',
      confirmText: '重設',
      danger: true
    });
    if (ok) await applyResultChange((s, w) => { delete s[sel]; delete w[sel]; });
  });
  $('#btnNext').addEventListener('click', () => {
    const id = nextReadyMatch();
    if (!id){ toast('🎉 目前沒有待進行的比賽'); return; }
    sel = id;
    renderAll();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // 名次頁
  $('#btnPrint').addEventListener('click', printResults);
  $('#btnCsv').addEventListener('click', exportCSV);
  $('#btnJson').addEventListener('click', exportJSON);
  $('#btnShare').addEventListener('click', async () => {
    const link = buildShareLink();
    try{
      await navigator.clipboard.writeText(link);
      toast('已複製分享連結！貼給別人就能看到目前比分');
    }catch(err){
      window.prompt('複製這個連結分享給別人：', link);
    }
  });

  // 設定頁
  $('#setTitle').addEventListener('input', e => {
    state.title = e.target.value;
    renderHeader();
    debounceSave();
  });
  $('#setWinScore').addEventListener('change', async e => {
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v) || v < 1 || v > 99){ e.target.value = state.winScore; return; }
    const ok = await trySetWinScore(v);
    if (!ok) e.target.value = state.winScore;
  });
  $('#setUiMode').addEventListener('change', e => {
    uiMode = (e.target.value === 'win') ? 'win' : 'score';
    try{ localStorage.setItem('ism-ui-mode', uiMode); }catch(err){}
    renderAll();
  });
  $('#nameGrid').addEventListener('input', e => {
    const input = e.target.closest('input[data-seed]');
    if (!input) return;
    state.names[input.dataset.seed] = input.value;
    renderAll({skipSettings: true});
    debounceSave();
  });
  $('#btnResetAll').addEventListener('click', async () => {
    const ok = await confirmModal({
      title: '清除所有結果',
      message: '這會清除全部比分與「點選勝方」的結果（選手名單與設定保留），且無法復原。\n\n確定要清除嗎？',
      confirmText: '全部清除',
      danger: true
    });
    if (!ok) return;
    state.scores = {};
    state.winners = {};
    save();
    renderAll();
    toast('已清除所有比分與勝方結果');
  });
  $('#btnImport').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try{
      const obj = JSON.parse(await f.text());
      if (!obj || typeof obj !== 'object') throw new Error('bad');
      const st = freshState();
      if (obj.title) st.title = String(obj.title);
      if (Number.isFinite(obj.winScore)) st.winScore = Math.max(1, Math.min(99, Math.floor(obj.winScore)));
      if (obj.names && typeof obj.names === 'object'){
        for (const key in obj.names){
          if (key in DEFAULT_NAMES) st.names[key] = String(obj.names[key]);
        }
      }
      st.scores = sanitizeScores(obj.scores);
      state = st;
      save();
      renderAll();
      toast('已成功匯入備份');
    }catch(err){
      toast('匯入失敗：檔案格式不正確');
    }
    e.target.value = '';
  });

  // Modal
  $('#modalOk').addEventListener('click', () => closeModal(true));
  $('#modalCancel').addEventListener('click', () => closeModal(false));
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(false);
  });
}

/* ===================== 啟動 ===================== */

sel = firstReady(state.scores, state.winScore);
bindEvents();
renderAll();
applyZoom();
if (sharedLoaded){ save(); toast('已載入分享連結中的比分'); }
initSync();
</script>
</body>
</html>
